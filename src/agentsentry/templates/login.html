<!doctype html>
<html lang="{{ ui_language }}"><meta charset="utf-8"><title>{{ _("AgentSentry 登录") }}</title>
<style>body{font:16px system-ui;background:#f4f7fa;color:#142536;max-width:420px;margin:12vh auto}main{background:white;padding:2rem;border-radius:12px;box-shadow:0 5px 30px #b8c5d544}input,button{font:inherit;padding:.7rem;width:100%;box-sizing:border-box;margin:.5rem 0}button{background:#145d76;color:white;border:0;border-radius:5px}.language-switch{display:flex;justify-content:flex-end;gap:10px}.language-switch a{color:#145d76;padding:5px 8px;border-radius:5px}.language-switch a[aria-current=true]{background:#eaf1f5;font-weight:600}</style>
<main>{% include "_language_switch.html" %}<h1>AgentSentry</h1><p>{{ _("本机安全实验室") }}</p>
{% if error %}<p role="alert">{{ (error) | ui }}</p>{% endif %}
<form method="post" action="/login"><label>{{ _("租户 ID") }}<input name="tenant_id" value="default" required></label><label>{{ _("管理员密码") }}<input type="password" name="password" required autofocus></label><button>{{ _("登录") }}</button></form></main></html>
