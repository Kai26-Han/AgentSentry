    limitation: V3.4 将已核验 IP 固定到本次 TCP 连接，受控测试验证了连接目标选择；仍需真实公网重绑定和不同网络栈现场验证。合成探针只检查一个固定只读结果，无法证明远端程序完整性或所有响应语义；GitHub 仍限默认租户、固定工具和一次已记录的受控写入，新解析器尚未第二次在线写入。

