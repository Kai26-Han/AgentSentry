<text x="729" y="392" class="label">检查</text>
<polyline points="790,492 725,492" fill="none" stroke="#168579" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#back)" stroke-linejoin="round"/>
<text x="730" y="522" class="label" style="fill:#168579;">决定</text>
<polyline points="1180,393 1245,393" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1184" y="369" class="label">执行</text>
<polyline points="1245,496 1180,496" fill="none" stroke="#168579" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#back)" stroke-linejoin="round"/>
<text x="1184" y="526" class="label" style="fill:#168579;">来源</text>
<rect x="60" y="670" width="270" height="135" rx="16" fill="#f0eef9" stroke="#c7bedc" stroke-width="2"/>
<text x="82" y="712" class="head">攻防实验运行器</text>
<text x="82" y="752" class="body">固定重放 / 真实模型</text>
<text x="82" y="787" class="body">版本化样本与正常对照</text>
<polyline points="195,670 195,530" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="211" y="613" class="label">新的测试任务</text>
<rect x="395" y="670" width="330" height="135" rx="16" fill="#f0eef9" stroke="#c7bedc" stroke-width="2"/>
<text x="417" y="712" class="head">只读协作 Agent</text>
<text x="417" y="752" class="body">独立身份、单跳委托</text>
<text x="417" y="787" class="body">缩减权限、低信任结果</text>
<polyline points="725,723 755,723 755,570 790,570" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="540" y="639" class="label">委托协议 → 同一网关</text>
<rect x="790" y="670" width="390" height="135" rx="16" fill="#fff" stroke="#cbdce7" stroke-width="2"/>
<text x="812" y="712" class="head">PostgreSQL</text>
<text x="812" y="752" class="body">操作记录 / 长期记忆</text>
<text x="812" y="787" class="body">审计事件 / 事务 Outbox</text>
<polyline points="990,590 990,670" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1006" y="636" class="label">提交证据</text>
<rect x="1245" y="670" width="295" height="135" rx="16" fill="#fff" stroke="#cbdce7" stroke-width="2"/>
<text x="1267" y="712" class="head">异步分析与维护</text>
<text x="1267" y="752" class="body">Dispatcher / Celery</text>
<text x="1267" y="787" class="body">Judge、告警与威胁关联</text>
<polyline points="1180,709 1245,709" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1186" y="685" class="label">投递</text>
<polyline points="1245,770 1180,770" fill="none" stroke="#168579" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#back)" stroke-linejoin="round"/>
<text x="1186" y="799" class="label" style="fill:#168579;">结果</text>
<rect x="790" y="895" width="750" height="125" rx="16" fill="#fff" stroke="#cbdce7" stroke-width="2"/>
<text x="812" y="937" class="head">Web 控制台（网关内）</text>
<text x="812" y="977" class="body">会话调查、事实卡审批、记忆与数据流管理、实验报告</text>
<polyline points="990,805 990,895" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1006" y="855" class="label">关联记录</text>
<polyline points="1390,805 1390,895" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="1406" y="855" class="label">分析状态</text>
<rect x="60" y="875" width="665" height="145" rx="16" fill="#e9f0f5"/>
<text x="83" y="909" class="head">读图要点</text>
<text x="83" y="945" class="body">模型提出动作；网关作安全判定。</text>
<text x="83" y="978" class="body">适配层请求模型；执行端运行获准工具。</text>
<text x="83" y="1011" class="body">Judge 提供事后信号，不参与同步授权。</text>
<line x1="60" y1="1057" x2="1540" y2="1057" stroke="#cfdee7"/>
<text x="60" y="1090" class="small">实线：请求、执行与留证     虚线：返回决定与结果</text>
<text x="790" y="1090" class="small">保护范围：显式接入路径；完整流程见架构文档</text>
</svg>