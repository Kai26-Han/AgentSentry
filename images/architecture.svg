<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">AgentSentry 整体架构：安全检查、执行与证据</title>
<desc id="desc">用户任务和研究样本进入示例 Agent，可信适配层请求安全网关检查。网关决定工具执行与模型发送、回答展示和记忆读写。适配层实际请求模型，获准工具在执行端运行。PostgreSQL 审计与 Outbox 驱动异步 Judge 和告警，Web 展示证据与管理操作。独立只读协作 Agent 通过缩减权限接入网关。</desc>
<defs>
 <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#45657d"/></marker>
 <marker id="back" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#168579"/></marker>
</defs>
<style>
 text {font-family: 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif;fill:#153448}
 .head {font-size:26px;font-weight:700}
 .body {font-size:22px;fill:#466174}
 .label {font-size:19px;fill:#45657d}
 .small {font-size:19px;fill:#617b8b}
</style>
<rect width="1600" height="1110" fill="#f3f7fb"/>
<rect x="0" y="0" width="1600" height="86" fill="#153448"/>
<text x="60" y="55" style="font-size:34px;font-weight:700;fill:#fff">AgentSentry</text>
<text x="330" y="55" style="font-size:24px;fill:#d3e4ee">从安全检查到实际执行，再到可追溯证据</text>

<rect x="60" y="130" width="270" height="115" rx="16" fill="#fff" stroke="#cbdce7" stroke-width="2"/>
<text x="82" y="172" class="head">用户任务</text>
<text x="82" y="212" class="body">日常任务 / 合成输入</text>
<rect x="395" y="130" width="330" height="115" rx="16" fill="#fff" stroke="#cbdce7" stroke-width="2"/>
<text x="417" y="172" class="head">模型服务</text>
<text x="417" y="212" class="body">本地 / 已登记远程模型</text>
<rect x="60" y="350" width="270" height="180" rx="16" fill="#fff" stroke="#cbdce7" stroke-width="2"/>
<rect x="60" y="368" width="5" height="144" rx="2" fill="#5d879f"/>
<text x="82" y="392" class="head">示例 Agent</text>
<text x="82" y="432" class="body">理解任务、提出调用</text>
<text x="82" y="467" class="body">生成回答与记忆候选</text>
<rect x="395" y="350" width="330" height="180" rx="16" fill="#edf6fc" stroke="#8fb8d2" stroke-width="2"/>
<rect x="395" y="368" width="5" height="144" rx="2" fill="#3482ad"/>
<text x="417" y="392" class="head">可信适配层</text>
<text x="417" y="432" class="body">持有凭据与会话绑定</text>
<text x="417" y="467" class="body">提交检查、发送准许消息</text>
<text x="417" y="502" class="body">展示网关准许的回答</text>
<rect x="790" y="290" width="390" height="300" rx="16" fill="#eaf7f2" stroke="#65aa96" stroke-width="2"/>
<rect x="790" y="308" width="5" height="264" rx="2" fill="#168579"/>
<text x="812" y="332" class="head">FastAPI 安全网关</text>
<text x="812" y="372" class="body">身份 / 权限 / 工具策略</text>
<text x="812" y="407" class="body">审批 / 运行时 / 行动预算</text>
<text x="812" y="442" class="body">模型出口 / 输出 / 记忆检查</text>
<text x="812" y="477" class="body">决定与审计先提交</text>
<rect x="812" y="541" width="344" height="31" rx="8" fill="#d7eee4"/>
<text x="825" y="564" class="small" style="fill:#186756;font-size:20px;">Redis：权限与次数原子校验</text>
<rect x="1245" y="290" width="295" height="300" rx="16" fill="#fff" stroke="#cbdce7" stroke-width="2"/>
<rect x="1245" y="308" width="5" height="264" rx="2" fill="#64829a"/>
<text x="1267" y="332" class="head">获准工具执行</text>
<text x="1267" y="372" class="body">固定本地模拟工具</text>
<text x="1267" y="407" class="body">本地 MCP（stdio）</text>
<text x="1267" y="442" class="body">登记远程 MCP / GitHub</text>
<text x="1267" y="477" class="body">受限 Docker 沙箱</text>
<polyline points="195,245 195,350" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="210" y="307" class="label">任务</text>
<polyline points="330,422 395,422" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="336" y="400" class="label">提案</text>
<polyline points="395,477 330,477" fill="none" stroke="#168579" stroke-width="2.6" stroke-dasharray="7 6" marker-end="url(#back)" stroke-linejoin="round"/>
<text x="337" y="506" class="label" style="fill:#168579;">结果</text>
<polyline points="525,350 525,245" fill="none" stroke="#45657d" stroke-width="2.6" marker-end="url(#arrow)" stroke-linejoin="round"/>
<text x="420" y="285" class="label">准许消息</text>
