<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1110" viewBox="0 0 1600 1110" role="img" aria-labelledby="title desc">
<title id="title">AgentSentry Architecture: Checks, Execution and Evidence</title>
<desc id="desc">Tasks and synthetic lab inputs reach the demo Agent. The trusted adapter requests gateway checks. The gateway decides tool, model, output and memory safety; adapters send model requests and display approved text. Tool endpoints execute approved actions. PostgreSQL audit and Outbox support asynchronous Judge and alerts. Web links evidence and administration. An independent read-only collaborator uses attenuated authority through the same gateway.</desc>
